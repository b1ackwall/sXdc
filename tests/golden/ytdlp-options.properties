# Golden yt-dlp options shared by the Python and Kotlin checks.
# Python: sxdc_download.download_audio / build_ydl_opts. Kotlin: settings/YtDlpCommandPreview.
# Plain key=value (no JSON: org.json is stubbed on the JVM).
#
# Which keys appear where:
#  - In the Settings preview (CLI-expressible): codec, quality, outputTemplate, embedMetadata,
#    embedThumbnail, restrictFilenames, format, noplaylist, retries, fragmentRetries.
#  - Real options only, never shown in the preview: quiet, noWarnings, noprogress, writeThumbnail
#    (implied by --embed-thumbnail), and the options with no golden value at all: paths,
#    ffmpeg_location, postprocessor_hooks (see ALLOWED_UNLISTED in test_options_golden.py).
#  - errorKinds is about the result contract, not yt-dlp options.
# Adding a real option fails test_options_golden.py until it is listed here or allowlisted there.
codec=flac
quality=0
outputTemplate=%(title).100s [%(id)s].%(ext)s
embedMetadata=true
embedThumbnail=true
restrictFilenames=true
format=bestaudio/best
noplaylist=true
retries=3
fragmentRetries=3
noprogress=true
quiet=true
noWarnings=true
writeThumbnail=true
# KIND_* identifiers in sxdc_download.py, comma separated.
errorKinds=network,unavailable,unsupported,restricted,auth,storage,media_tools,no_output,engine,extractor,rate_limited,unknown
