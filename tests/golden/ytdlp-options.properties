# Golden yt-dlp options shared by the Python and Kotlin checks.
# Python: sxdc_download.download_audio / build_ydl_opts. Kotlin: settings/YtDlpCommandPreview.
# Plain key=value (no JSON: org.json is stubbed on the JVM).
codec=flac
quality=0
outputTemplate=%(title)s.%(ext)s
embedMetadata=true
embedThumbnail=true
restrictFilenames=true
# KIND_* identifiers in sxdc_download.py, comma separated.
errorKinds=network,unavailable,unsupported,restricted,auth,storage,media_tools,no_output,engine,unknown
