# ruff config for the host-side Python code. See docs/code-quality.md.
target-version = "py312"
line-length = 100
extend-exclude = [".venv", "build", "app/build", ".gradle", ".kotlin", ".idea"]

[lint]
# E501 (line length) is deliberately not selected.
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

