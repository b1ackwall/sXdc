# ruff config for the host-side Python code. See docs/code-quality.md.
target-version = "py312"
line-length = 100
extend-exclude = [".venv", "build", "app/build", ".gradle", ".kotlin", ".idea"]

[lint]
# E501 (line length) is deliberately not selected.
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

# Existing findings, absorbed here instead of editing code. Remove an entry once its file is
# cleaned up. Counts are as of the 2026-10-31 setup.
[lint.per-file-ignores]
"app/src/main/python/sxdc_download.py" = ["UP031"]  # 4
"app/src/main/python/sxdc_verify.py" = ["UP031"]  # 8
"tests/python/test_download_audio.py" = ["I001", "UP031"]  # 1, 1
"tests/python/test_options_golden.py" = ["I001", "UP031"]  # 1, 1
"tests/python/test_classify.py" = ["I001"]  # 1
"tests/python/test_expand_urls.py" = ["I001"]  # 1
